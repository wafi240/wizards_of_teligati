name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set Android SDK Path
        shell: pwsh
        run: |
          $sdkPath = "$env:ANDROID_HOME"
          Write-Host "ANDROID_HOME: $sdkPath"
          Set-Content -Path "android/local.properties" -Value "sdk.dir=$($sdkPath.Replace('\', '\\'))"
          Get-Content "android/local.properties"

      - name: Build Debug APK with Gradle
        shell: pwsh
        run: |
          cd android
          try {
            .\gradlew.bat assembleDebug --stacktrace 2>&1 | Tee-Object -FilePath "build.log"
          } finally {
            Get-Content "build.log" -Tail 50 | Write-Host
          }

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizards-of-Teligati-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Wizards of Teligati - Final"
          body: |
            ### 🧙 Wizards of Teligati — Android Application
            **KUET's Academic, Research & Career Collaboration Platform**

            #### 📱 Direct APK Download & Installation
            1. Download `app-debug.apk` directly to your Android device from the Assets section below.
            2. If prompted by Android, allow **"Install unknown apps"** for your browser/file manager.
            3. Tap **Install** and open **Wizards of Teligati**.
            4. Choose your portal: **Student**, **Faculty**, or **Alumni**.

            #### 🧪 Pre-Configured Demo Accounts (Password: `123456`)
            - **Student:** `farhan.student.demo@example.com` (Farhan)
            - **Student:** `raju.student.demo@example.com` (Raju)
            - **Alumni:** `adnan.alumni.demo@example.com` (Adnan)
            - **Alumni:** `joy.alumni.demo@example.com` (Joy)
            - **Teacher:** `fahad.teacher.demo@example.com` (Fahad)
            - **Teacher:** `wafi.teacher.demo@example.com` (Wafi)

            #### 📦 Release Details
            - **Package:** `com.teligati.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Architecture:** Firebase Auth + Cloud Firestore + Room SQLite Offline Mirror
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
