# =============================================================================
# Wizards of Teligati Backend Configuration
# =============================================================================
spring.application.name=Wizards of Teligati Backend
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Default to dev profile (embedded H2 + seeder) if not explicitly set
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Connection via Environment Variables (Safe Dev Defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teligati}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA & Hibernate Schema Validation (Hibernate validates Flyway-managed schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application Metadata & Versioning
app.version=1.0.0-SNAPSHOT

# CORS Configuration (Comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# JWT Token Configuration
app.jwt.secret=${JWT_SECRET:d2l6YXJkcy1vZi10ZWxpZ2F0aS1zZWNyZXQta2V5LTIwMjYtc3ByaW5nLWJvb3Qtand0LTI1Ni1iaXQ=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
