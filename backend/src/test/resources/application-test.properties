# =============================================================================
# Isolated Test Database Configuration (H2 in PostgreSQL compatibility mode)
# =============================================================================
spring.application.name=Wizards of Teligati Backend Test
server.port=-1

spring.datasource.url=jdbc:h2:mem:teligati_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway execution against clean isolated test database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate validates schema generated by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.version=1.0.0-TEST
app.cors.allowed-origins=http://localhost:3000

# JWT Token Configuration
app.jwt.secret=d2l6YXJkcy1vZi10ZWxpZ2F0aS1zZWNyZXQta2V5LTIwMjYtc3ByaW5nLWJvb3Qtand0LTI1Ni1iaXQ=
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# Seeder enabled in default test profile
app.seeder.enabled=true
