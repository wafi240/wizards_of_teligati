name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses & Install SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Fix gradlew permissions
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizards-of-Teligati-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Wizards of Teligati - Final"
          body: |
            ### 🧙 Wizards of Teligati — Android Application
            **KUET's Academic, Research & Career Collaboration Platform**

            #### 📱 Direct APK Download & Installation
            1. Download `app-debug.apk` directly to your Android device from the Assets section below.
            2. If prompted by Android, allow **"Install unknown apps"** for your browser/file manager.
            3. Tap **Install** and open **Wizards of Teligati**.
            4. Choose your portal: **Student**, **Faculty**, or **Alumni**.

            #### 🧪 Pre-Configured Demo Accounts (Password: `123456`)
            - **Student:** `farhan.student.demo@example.com` (Farhan)
            - **Student:** `raju.student.demo@example.com` (Raju)
            - **Alumni:** `adnan.alumni.demo@example.com` (Adnan)
            - **Alumni:** `joy.alumni.demo@example.com` (Joy)
            - **Teacher:** `fahad.teacher.demo@example.com` (Fahad)
            - **Teacher:** `wafi.teacher.demo@example.com` (Wafi)

            #### 📦 Release Details
            - **Package:** `com.teligati.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Architecture:** Firebase Auth + Cloud Firestore + Room SQLite Offline Mirror
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
