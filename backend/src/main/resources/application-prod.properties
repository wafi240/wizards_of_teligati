# =============================================================================
# Wizards of Teligati Backend: Production Configuration
# =============================================================================
# Demo account seeding strictly disabled in production
app.seeder.enabled=false

# In production, JWT secret MUST be supplied via JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET:}

# Production JPA & Database Schema
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
